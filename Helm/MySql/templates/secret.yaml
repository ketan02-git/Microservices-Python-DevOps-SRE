
apiVersion: v1
kind: Secret
metadata:
  name: mysql-root-secret
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: {{ .Values.database.rootPassword | quote }}

---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-user-secret
type: Opaque
stringData:
  DB_PASSWORD: {{ .Values.database.userPassword | quote }}

---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-product-secret
type: Opaque
stringData:
  DB_PASSWORD: {{ .Values.database.userPassword | quote }}
