
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init

data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS users_db;
    CREATE DATABASE IF NOT EXISTS products_db;

    CREATE USER IF NOT EXISTS 'user_app'@'%' IDENTIFIED BY '${APP_PASSWORD}';
    CREATE USER IF NOT EXISTS 'product_app'@'%' IDENTIFIED BY '${APP_PASSWORD}';

    GRANT ALL PRIVILEGES ON users_db.* TO 'user_app'@'%';
    GRANT ALL PRIVILEGES ON products_db.* TO 'product_app'@'%';

    FLUSH PRIVILEGES;
