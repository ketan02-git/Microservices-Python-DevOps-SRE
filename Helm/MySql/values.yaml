    cpu: 1000m
    memory: 1Gi

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

resources: {}

ingress:
  enabled: false
  annotations: {}
  hosts: []
  tls: []

autoscaling:
  enabled: false

podLabels: {}
podAnnotations: {}

serviceAccount:
  create: true
  name: ""

httpRoute:
  enabled: false