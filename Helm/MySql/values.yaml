image:
  repository: mysql
  tag: "8.0"

service:
  type: ClusterIP
  port: 3306

storage:
  size: 5Gi
  storageClassName: ""

database:
  rootPassword: CHANGE_ME_ROOT
  userPassword: CHANGE_ME_APP

resources:
