replicaCount: 2

image:
  repository: cloudketan/product-service
  tag: pv1
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 4001
  targetPort: 4001
  nodePort: 30401

database:
  host: mysql
  port: "3306"
  name: products_db
  user: product_app

secret:
  name: mysql-product-secret
  passwordKey: DB_PASSWORD

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  readiness:
    initialDelaySeconds: 15
    periodSeconds: 10
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 20

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

ingress:
  enabled: false
  annotations: {}
  hosts: []
  tls: []

autoscaling:
  enabled: false

podLabels: {}
podAnnotations: {}

httpRoute:
  enabled: false